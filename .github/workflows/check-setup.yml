name: Check recorder setup - truthful live canary
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Exact public live watch URL, https://www.youtube.com/watch?v=VIDEO_ID'
        required: true
        type: string
      video_id:
        description: 'Expected exact 11-character video ID'
        required: true
        type: string
      channel_id:
        description: 'Expected exact UC channel ID'
        required: true
        type: string
      cleanup:
        description: 'Delete only this unique verified tiny test file/folder after the receipt'
        default: false
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: truthful-canary-${{ github.repository }}
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded pinned dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rclone >/dev/null || ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! sudo timeout --kill-after=10s 60s apt-get install -y --no-install-recommends -o Acquire::Retries=0 rclone ffmpeg; then
              sudo timeout --kill-after=10s 45s apt-get -o Acquire::Retries=0 update -qq
              sudo timeout --kill-after=10s 60s apt-get install -y --no-install-recommends -o Acquire::Retries=0 rclone ffmpeg
            fi
          fi
          timeout --kill-after=5s 60s python -m pip install --disable-pip-version-check 'yt-dlp[default]==2026.10.21'
          python -m yt_dlp --version
          node --version
          rclone version
          ffmpeg -version | head -n 1
      - name: One source, real media, private Drive receipt
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
          CANARY_SOURCE_URL: ${{ inputs.source_url }}
          CANARY_VIDEO_ID: ${{ inputs.video_id }}
          CANARY_CHANNEL_ID: ${{ inputs.channel_id }}
          CANARY_CLEANUP: ${{ inputs.cleanup }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python diagnostic_canary.py --output canary-result
      - name: Save redacted result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthful-canary-${{ github.run_id }}
          path: canary-result/canary-report.json
          if-no-files-found: error
          retention-days: 2
