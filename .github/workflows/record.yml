name: Verify supplied cookie binding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare credential identity without displaying credentials
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os
          records=[]
          for line in os.environ.get('YT_COOKIES','').splitlines():
              if not line or (line.startswith('#') and not line.startswith('#HttpOnly_')): continue
              fields=line.split('\t')
              if len(fields)==7: records.append([fields[0].removeprefix('#HttpOnly_'),fields[2],fields[5],fields[6]])
          actual=hashlib.sha256(json.dumps(sorted(records),separators=(',',':')).encode()).hexdigest()
          print('SUPPLIED_COOKIE_BINDING_MATCH=' + str(bool(records) and actual=='52143f538da4cf90e1853c1c5236dfeb3a17f59d6c300a90d6e441382a2661df').lower())
          PYCODE
