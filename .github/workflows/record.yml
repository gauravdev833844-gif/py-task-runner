name: Verify production recorder against a live channel
on:
  workflow_dispatch:
    inputs:
      channel:
        type: string
        default: '@SkyNews'
      duration_hours:
        type: number
        default: 0.017
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install 'yt-dlp[default,curl-cffi]==2026.10.21'
      - name: Run the production engine for about one minute
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CHANNEL_HANDLE: ${{ inputs.channel }}
          TARGET_CHANNEL_ID: ''
          HOURS: ${{ inputs.duration_hours }}
          OUT_DIR: './streams'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'@[A-Za-z0-9_.-]+', os.environ['CHANNEL_HANDLE'])
          assert 0 < float(os.environ['HOURS']) <= 0.05
          PY
          test -n "$YT_COOKIES"
          cookie_path="$RUNNER_TEMP/engine-cookies.txt"
          trap 'rm -f "$cookie_path"' EXIT
          umask 077
          printf '%s' "$YT_COOKIES" > "$cookie_path"
          unset YT_COOKIES
          export COOKIE_FILE="$cookie_path" USE_COOKIES=true
          python recorder.py
      - name: Verify captured video
        run: |
          python - <<'PY'
          import glob,json,subprocess,pathlib
          summaries=glob.glob('streams/*_summary.json')
          assert summaries, 'No recorder summary'
          result=json.loads(pathlib.Path(summaries[0]).read_text())
          assert result.get('final_file'), 'Recorder saved no final file'
          path='streams/'+result['final_file']
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',path]))
          assert float(info['format']['duration']) >= 10
          assert any(s.get('codec_type')=='video' for s in info['streams'])
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',path,'-t','3','-f','null','-'],check=True)
          print('PRODUCTION_ENGINE_LIVE_CAPTURE_PASS',result['client_used'],info['format']['duration'])
          PY
      - name: Preserve recording and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-engine-live-check
          path: streams/
          retention-days: 1
