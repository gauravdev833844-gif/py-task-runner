name: Bounded six-minute live and upload validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Regression and generated-media tests
        env:
          RECORD_WORKFLOW_PATH: validation/production-record.yml
        run: python -m unittest -v test_reliability
      - name: Six-minute capture, complete decode and bounded Gofile upload
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ vars.GOFILE_FOLDER_ID }}
        run: python validate_six_minutes.py
      - name: Save small sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-minute-live-upload-validation
          path: six-minute-validation/*.json
          retention-days: 2
