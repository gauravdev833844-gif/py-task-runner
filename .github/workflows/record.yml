name: Audited YouTube Recorder - YT Task 4

on:
  workflow_dispatch:
  schedule:
    # Shift 1: Raat 08:28 PM IST (14:58 UTC) -> 01:46 AM IST tak
    - cron: '58 14 * * *'
    # Shift 2: Raat 01:15 AM IST (19:45 UTC) -> 06:33 AM IST tak (31 min safe overlap)
    - cron: '45 19 * * *'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        streamer:
          - name: "GOREDOXLIVE"
            handle: "@GOREDOXLIVE"
            id: "UC8MRu8goXUOM-_YaGsUvsmQ"

          - name: "prankurv123"
            handle: "@prankurv123"
            id: "UCYe2VVWgjUoEEn9LaLSCk9w"

          - name: "itsanvro"
            handle: "@itsanvro"
            id: "UC-fYhYPs1OJNAtE9SjEb5Hw"

          - name: "aadarshyadav1"
            handle: "@aadarshyadav1"
            id: "UCyUlOENwi_2p_5Hv2fvkQvQ"

          - name: "nihaanbhattagainn"
            handle: "@nihaanbhattagainn"
            id: "UC7fUm_Vc21j2Njra8VUHiaA"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Recorder
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CHANNEL_HANDLE: ${{ matrix.streamer.handle }}
          TARGET_CHANNEL_ID: ${{ matrix.streamer.id }}
          HOURS: "5.3"
          OUT_DIR: "./streams"
          USE_COOKIES: ${{ secrets.YT_COOKIES != '' && 'true' || 'false' }}
          COOKIE_FILE: "cookies.txt"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
          fi
          python3 recorder.py
