name: Compare current Streamlink YouTube capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streamlink:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official packages
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install 'streamlink==8.6.2'
      - name: Bounded authenticated capture and validation
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python - <<'PY'
          import os,pathlib,tempfile,subprocess,json,datetime,signal
          out=pathlib.Path('results');out.mkdir()
          report={'tested_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tool':'Streamlink','version':'8.6.2','channel':'@SkyNews','cookies_used':True,'status':'UNVERIFIED'}
          try:
              with tempfile.TemporaryDirectory() as private:
                  cookie=pathlib.Path(private)/'cookies.txt'
                  value=os.environ.pop('YT_COOKIES','')
                  if not value:
                      report['status']='MISSING_COOKIE_BINDING';raise SystemExit(1)
                  cookie.write_text(value);cookie.chmod(0o600)
                  value=''
                  cmd=['streamlink','--no-config','--loglevel','warning','--http-cookies-file',str(cookie),'--http-timeout','10','--retry-max','0','--stream-segmented-duration','20','--force','--output',str(out/'capture.ts'),'https://www.youtube.com/@SkyNews/live','720p,best']
                  proc=subprocess.Popen(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                  try:stdout,stderr=proc.communicate(timeout=75)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid,signal.SIGINT)
                      try:stdout,stderr=proc.communicate(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid,signal.SIGKILL);stdout,stderr=proc.communicate()
                      report['status']='CAPTURE_TIMEOUT';raise SystemExit(1)
                  report['exit_code']=proc.returncode
                  if proc.returncode:
                      errors=(stdout+stderr).casefold()
                      if 'bot' in errors or 'sign in' in errors: report['status']='youtube_authentication_or_botcheck'
                      elif 'no playable streams' in errors or 'no streams' in errors: report['status']='no_playable_streams'
                      elif '403' in errors: report['status']='youtube_403'
                      else:report['status']='extraction_or_download_failed'
                      raise SystemExit(1)
                  probe=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(out/'capture.ts')],text=True,capture_output=True,timeout=15)
                  if probe.returncode:
                      report['status']='UNREADABLE_MEDIA';raise SystemExit(1)
                  info=json.loads(probe.stdout)
                  duration=float(info.get('format',{}).get('duration',0))
                  report['captured_seconds']=duration
                  if duration<10 or not any(s.get('codec_type')=='video' for s in info.get('streams',[])):
                      report['status']='INSUFFICIENT_VIDEO';raise SystemExit(1)
                  decode=subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(out/'capture.ts'),'-t','3','-f','null','-'],capture_output=True,timeout=20)
                  if decode.returncode:
                      report['status']='DECODE_FAILED';raise SystemExit(1)
                  report['status']='PASS'
          finally:
              (out/'result.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report))
          PY
      - name: Preserve sanitized test result and clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlink-comparison
          path: results/
          retention-days: 1
