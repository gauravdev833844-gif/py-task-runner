name: Validate uploader Release backup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -q -r requirements-dev.txt
      - name: Regression tests
        env:
          RECORD_WORKFLOW_PATH: validation/production-record.yml
        run: python -m unittest -v test_reliability
      - name: Real draft Release fallback and readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python validate_release_backup.py
      - name: Cleanup test draft if interrupted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="recorder-backup-${GITHUB_RUN_ID}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-backup-validation
          path: release-backup-validation/*.json
          retention-days: 1
