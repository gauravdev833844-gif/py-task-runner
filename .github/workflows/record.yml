name: YouTube Live Recorder
run-name: Recorder session ${{ inputs.session_id || github.run_id }} / shift ${{ inputs.shift_index || 0 }}

on:
  workflow_dispatch:
    inputs:
      total_hours:
        description: 'Total monitoring time from manual start, up to 24 hours'
        required: true
        default: 12
        type: number
      session_start:
        description: 'Internal continuation field; leave empty for a fresh session'
        required: false
        default: ''
        type: string
      session_id:
        description: 'Internal continuation field; leave empty for a fresh session'
        required: false
        default: ''
        type: string
      shift_index:
        description: 'Internal continuation field; leave 0 for a fresh session'
        required: false
        default: 0
        type: number
permissions:
  contents: read

env:
  OUT_DIR: './streams'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.plan.outputs.active }}
      deadline: ${{ steps.plan.outputs.deadline }}
      chain: ${{ steps.plan.outputs.chain }}
      next_at: ${{ steps.plan.outputs.next_at }}
      next_index: ${{ steps.plan.outputs.next_index }}
      session_start: ${{ steps.plan.outputs.session_start }}
      session_id: ${{ steps.plan.outputs.session_id }}
      total_hours: ${{ steps.plan.outputs.total_hours }}
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan bounded overnight session
        id: plan
        env:
          TOTAL_HOURS: ${{ inputs.total_hours }}
          SESSION_START: ${{ inputs.session_start }}
          SESSION_ID: ${{ inputs.session_id }}
          SHIFT_INDEX: ${{ inputs.shift_index }}
        run: python3 shift_plan.py
      - name: Read channel list
        id: channels
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('channels.json', encoding='utf-8-sig') as f:
              channels = json.load(f)
          if len(channels) != 1:
              raise SystemExit('Use exactly one YouTube channel per repository')
          if not isinstance(channels, list) or not channels:
              raise SystemExit('channels.json must be a non-empty JSON array')
          for item in channels:
              if not isinstance(item, dict) or not item.get('handle'):
                  raise SystemExit('Each channel needs a handle; id is optional')
          print('matrix=' + json.dumps({'channel': channels}, separators=(',', ':')))
          PY

  record:
    needs: prepare
    if: needs.prepare.outputs.active == 'true' 
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a hard execution ceiling; reserve the remaining
    # time after the 5h monitor for finalization, upload and fallback artifact.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Record ${{ matrix.channel.handle }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools
        run: |
          set -euo pipefail
          missing=()
          for tool in ffmpeg curl jq; do
            if ! command -v "$tool" >/dev/null; then missing+=("$tool"); fi
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Record this channel for the current overlapping window
        env:
          CHANNEL_HANDLE: ${{ matrix.channel.handle }}
          TARGET_CHANNEL_ID: ${{ matrix.channel.id }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          SESSION_DEADLINE: ${{ needs.prepare.outputs.deadline }}
        run: |
          set -euo pipefail
          cookie_path="$RUNNER_TEMP/youtube-recording-cookies.txt"
          trap 'rm -f "$cookie_path"' EXIT
          if [[ -n "$YT_COOKIES" ]]; then
            umask 077
            printf '%s' "$YT_COOKIES" > "$cookie_path"
            export USE_COOKIES='true'
            export COOKIE_FILE="$cookie_path"
          else
            echo 'YT_COOKIES secret is missing; continuing without cookies.'
            export USE_COOKIES='false'
            export COOKIE_FILE=''
          fi
          unset YT_COOKIES
          HOURS="$(python shift_plan.py --duration-until "$SESSION_DEADLINE")"
          export HOURS
          python recorder.py
      - name: Preserve recordings before external upload
        id: recording-backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ matrix.channel.handle }}-${{ github.run_id }}
          path: |
            streams/**/*.ts
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Upload recording files to Gofile
        id: publish
        if: always()
        run: |
          mkdir -p streams
          failed=0
          found=0
          fallback_paths=''
          links_file="$RUNNER_TEMP/recorder-links.txt"
          : > "$links_file"
          stagger=$(( (RANDOM % 56) + 5 ))
          echo "Waiting ${stagger}s before upload to spread concurrent jobs."
          sleep "$stagger"
          while IFS= read -r -d '' f; do
            found=1
            echo "Uploading $(basename "$f")"
            ok=0
            for attempt in 1 2; do
              response=$(curl --fail --silent --show-error --max-time 600 \
                -X POST 'https://upload.gofile.io/uploadfile' \
                -F "file=@$f" || true)
              status=$(printf '%s' "$response" | jq -r '.status // empty' 2>/dev/null || true)
              link=$(printf '%s' "$response" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [[ "$status" == 'ok' && -n "$link" ]]; then
                echo "$(basename "$f"): $link" | tee -a "$GITHUB_STEP_SUMMARY"
                printf '%s: %s\n' "$(basename "$f")" "$link" >> "$links_file"
                ok=1
                break
              fi
              echo "Upload attempt $attempt failed; retrying."
              sleep $((attempt * 10))
            done
            if (( ok == 0 )); then
              echo "UPLOAD FAILED; scheduling Actions artifact backup: $(basename "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
              fallback_paths+="$f"$'\n'
              failed=1
            fi
          done < <(find streams -type f -size +1M -name '*.ts' ! -name '*_short_exit_*' -print0)
          if (( found == 0 )); then
            echo 'No recording file found.' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '::warning::This channel job completed without a recording file.'
          fi
          {
            printf 'fallback_paths<<EOF\n'
            printf '%s' "$fallback_paths"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
          echo "links_file=$links_file" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          exit "$failed"
      - name: Preserve failed uploads as a temporary video artifact
        id: media-backup
        if: always() && steps.publish.outputs.fallback_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-backup-${{ matrix.channel.handle }}-${{ github.run_id }}
          path: ${{ steps.publish.outputs.fallback_paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save small diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.channel.handle }}-${{ github.run_id }}
          path: |
            streams/**/*_session.log
            streams/**/*_summary.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Send links to Telegram (text only)
        if: always() && steps.publish.outputs.found == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKS_FILE: ${{ steps.publish.outputs.links_file }}
          VIDEO_BACKUP_URL: ${{ steps['media-backup'].outputs['artifact-url'] }}
          CHANNEL_HANDLE: ${{ matrix.channel.handle }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Telegram secrets are not configured; skipping text notification.'
            exit 0
          fi
          message="YouTube recorder result: ${CHANNEL_HANDLE}"
          if [[ -n "$LINKS_FILE" && -s "$LINKS_FILE" ]]; then
            message+=$'\n'"$(cat "$LINKS_FILE")"
          fi
          if [[ -n "$VIDEO_BACKUP_URL" ]]; then
            message+=$'\n'"Upload failed; temporary GitHub video backup (sign-in/access may be required): ${VIDEO_BACKUP_URL}"
          fi
          if [[ "$message" == "YouTube recorder result: ${CHANNEL_HANDLE}" ]]; then
            message+=$'\nRecording files were found, but external upload failed. Check this job’s Summary and artifacts.'
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"

  next-shift:
    needs: prepare
    if: needs.prepare.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Start the next overlapping shift automatically
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref_name }}
          TOTAL_HOURS: ${{ needs.prepare.outputs.total_hours }}
          SESSION_START: ${{ needs.prepare.outputs.session_start }}
          SESSION_ID: ${{ needs.prepare.outputs.session_id }}
          NEXT_INDEX: ${{ needs.prepare.outputs.next_index }}
          NEXT_AT: ${{ needs.prepare.outputs.next_at }}
          DEADLINE: ${{ needs.prepare.outputs.deadline }}
        run: python3 chain_shift.py
