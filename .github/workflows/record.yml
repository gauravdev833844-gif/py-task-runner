name: Validate one automatic next-shift dispatch
on:
  workflow_dispatch:
    inputs:
      phase:
        required: false
        default: '0'
        type: string
permissions:
  contents: read
  actions: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one child or verify child completion
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          if [[ "$PHASE" == 0 ]]; then
            gh workflow run record.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f phase=1
            echo 'NEXT_SHIFT_DISPATCH_ACCEPTED'
          elif [[ "$PHASE" == 1 ]]; then
            echo 'NEXT_SHIFT_CHILD_EXECUTED'
          else
            echo 'Unexpected test phase' >&2
            exit 1
          fi
