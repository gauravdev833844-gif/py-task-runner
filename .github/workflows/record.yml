name: Bounded recorder reliability validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Run regression and generated-media tests
        run: python -m unittest -v test_reliability
      - name: One short live capture and complete audio/video decode
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python validate_v2_on_runner.py
      - name: Preserve sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-v2-validation
          path: v2-validation-artifact/
          retention-days: 1
